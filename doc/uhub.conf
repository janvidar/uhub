# uhub.conf - A example configuration file.
# You should normally place this file in /etc/uhub/uhub.conf
# and customize some of the settings below.
#
# This file is read only to the uhub daemon, and if you
# make changes to it while uhub is running you can send a
# HUP signal to it ( $ killall -HUP uhub ), to reparse configuration (only on UNIX).
# All configuration directives: https://www.uhub.org/config.php

# Bind to this port and address
# server_bind_addr=any means listen to "::" if IPv6 is supported
# by the host OS, otherwise 0.0.0.0.
server_port=1511
server_bind_addr=any

# Alternative server ports
# server_alt_ports = 1512, 1513

# Number of background threads used to resolve hostnames (for hub linking and
# registration-server announcements). Takes effect on restart. Default is 4.
# dns_thread_pool_size = 4

# Prometheus metrics endpoint.
# When enabled, an HTTP "GET <metrics_path>" on the regular server port(s) is
# answered with a Prometheus text-exposition document, guarded by a bearer token.
# Works over plain HTTP and, when tls_enable is set, over HTTPS on the same port:
#   curl -H "Authorization: Bearer <token>" http://<host>:1511/metrics
#   curl -k -H "Authorization: Bearer <token>" https://<host>:1511/metrics
# NOTE: plain HTTP is accepted on the same port, so over plain HTTP the token is
# not confidential on an untrusted network -- scrape over HTTPS or loopback/a
# trusted network.
# metrics_enable = yes
# metrics_token = "change-me-to-a-long-random-secret"
# metrics_path = "/metrics"

# Bulletin boards (the BBS0 extension).
# Durable, threaded lists of posts that a client subscribes to, catches up on
# and keeps -- chat that does not vanish when you were not looking. The hub
# holds an index only: for each post it records who submitted it, when, on which
# board, and the Tiger tree hash naming the document. The bytes of a post never
# touch the hub; they travel between clients over the ordinary search and
# transfer machinery, so a board stays readable for as long as some client still
# holds and serves its posts. An operator who wants a board to last should run a
# client that subscribes to it and keeps everything.
# See doc/boards.conf for the board definitions, and doc/bbs.txt for how to run
# one.
# bbs_enable = yes
# file_bbs_boards = "/etc/uhub/boards.conf"
# file_bbs_index = "/var/lib/uhub/bbs.db"
#
# Bounds. A subscription is a standing instruction to send data, obtained with
# one short command; posting is the one thing only the hub can refuse; and a
# client subscribing from the beginning of a board receives every retained entry
# at once, which is what bbs_max_posts_per_board really bounds.
# bbs_max_subscriptions = 8
# bbs_post_interval = 60
# bbs_max_posts_per_board = 5000

# The maximum amount of users allowed on the hub.
max_users=500

# Seconds a logged-in connection may go without the hub writing to it before the
# hub sends an empty line as a keepalive. This is how a connection the peer has
# already dropped (NAT/firewall state expired, client vanished) gets noticed, so
# that a client reconnecting after its own keepalive failed is not rejected as
# "CID taken" by the hub's stale copy. It is also how long a session must have
# been silent before a login with the same CID is allowed to replace it -- a
# session that is still talking is never displaced. 0 disables both.
# Default is 120.
# keepalive_interval = 120

# If 1, will show a "Powered by uhub/{VERSION}".
show_banner=1

# If enabled then operating system and cpu architecture is part of the banner.
show_banner_sys_info=1

# Allow only registered users on the hub if set to 1.
registered_users_only=0

# A server name and description.
hub_name=my hub
hub_description=Powered by uhub

# Announce this hub to an ADC hub-list registration server at startup.
# When set, the hub sends a single HTTP POST with its IINF line to this URL,
# so hub lists can pick it up automatically. Leave empty to disable (private
# hubs). Also set hub_address so the announce carries a reachable address.
# reg_server_url=http://adcreg.dchublist.org:8080/register

# Set this to 0, and the hub will disconnect everyone
hub_enabled=1

# Access control list (bans / denied nicks). Registered users are handled by an
# auth plugin (see file_plugins), not here. When unset the hub reads users.conf
# from its own configuration directory, so the shipped list of denied nicks
# applies without naming a path here.
# file_acl = /etc/uhub/users.conf

# Plugin configuration. When unset the hub loads a built-in default set --
# SQLite authentication, logging, topic commands, chat history and user
# commands -- which is what makes a fresh install usable with no configuration.
# Set this only to depart from those defaults; it replaces them entirely.
# See plugins.conf for the full list of plugins and their parameters, and set
# plugin_defaults = no to run with no plugins at all.
# file_plugins = /etc/uhub/plugins.conf

# Optional file holding the msg_* status strings the hub sends to clients.
# Useful for translating them. See messages.conf.
# file_messages = /etc/uhub/messages.conf

# Comma-separated IP ranges (CIDR, lo-hi range, or single address) whose clients
# may advertise their own IPv4 address instead of the one the hub observes. Use
# for trusted clients behind NAT / on the hub's LAN. Replaces the old nat_ip acl
# keyword. Only list networks you trust.
# nat_override = 10.0.0.0/8,192.168.0.0/16

# HBRI (hybrid IPv4/IPv6 connectivity).
# A client is normally published with the address of the single protocol it
# connected over, so IPv4-only and IPv6-only users cannot connect to each other.
# With HBRI the hub asks a dual-stack client to open a short-lived second
# connection over the other protocol; on success its INF carries both an IPv4
# and an IPv6 address. The hub only ever publishes addresses it observed itself.
# Requires the hub to be reachable on both protocols. Both addresses below must
# be set, otherwise the extension is not advertised. See doc/architecture.txt.
# hbri_enable = yes
# hbri_address4 = "192.0.2.1"
# hbri_address6 = "2001:db8::1"

# TLS/SSL support.
# Encrypted ("adcs://") connections are offered by default: with no certificate
# configured the hub creates a self-signed one in its state directory on first
# start and keeps it. ADC clients pin the certificate's key fingerprint, which
# the hub advertises as ?kp= in its own address, so that pair is the hub's
# identity -- it is never regenerated once created.
# Plaintext adc:// keeps working alongside it on the same port; set
# tls_require=1 to refuse plaintext, or tls_enable=0 to turn TLS off entirely.
# tls_enable=1
# tls_require=0
#
# To use your own certificate (a CA-issued one, say) set both of these. A path
# that does not exist is then an error rather than a cue to generate one.
# tls_certificate=/etc/uhub/server.crt
# tls_private_key=/etc/uhub/server.key

# Minimum TLS version accepted from clients. Valid values are "1.2" and "1.3".
# tls_version=1.2

# Preferred ciphers for TLS 1.2 and earlier (OpenSSL cipher-list format).
# tls_ciphersuite=ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+3DES:DH+3DES:RSA+AESGCM:RSA+AES:RSA+3DES:!aNULL:!MD5:!DSS

# Preferred cipher suites for TLS 1.3. These use a separate namespace from the
# setting above and only take effect when TLS 1.3 is negotiated.
# tls_ciphersuites=TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256

# Encrypted client-to-client connections go by two names: ADCS/ADCS-1.0, which
# is what ADC-EXT settled on, and ADC0/ADCS-0.10, which is what the extension
# was called while it was a draft and what the DC++ family still sends. They
# mean the same TLS, but a client recognises the spelling it announced and no
# other, so two clients that each know only one of them fall back to a plaintext
# transfer or none.
# With adcs_translate=1 the hub rewrites the protocol field of every relayed
# connect request -- and of the status message refusing one -- into the spelling
# its recipient announced. Off by default: that field belongs to the two clients,
# and the better fix is a client that reads and writes both spellings.
# adcs_translate=0

# Slots/share/hubs limits. All default to 0, meaning no limit -- uncomment and
# set the ones you want to enforce.
#    Example:
#    To require users to share at least 1 GB in order to enter the hub:
#    limit_min_share = 1024
# limit_max_hubs_user = 0
# limit_max_hubs_reg = 0
# limit_max_hubs_op = 0
# limit_max_hubs = 0
# limit_min_hubs_user = 0
# limit_min_hubs_reg = 0
# limit_min_hubs_op = 0
# limit_min_share = 0
# limit_max_share = 0
# limit_min_slots = 0
# limit_max_slots = 0

# Minimum length (in bytes) of a substring search term.
# Searches whose longest include term is shorter than this are rejected, which
# keeps searches precise and reduces hub traffic. Exact (TTH) searches and
# searches from operators and above are never restricted. 0 = off.
#    Example:
#    limit_min_search = 3
limit_min_search = 0

# Flood control support:
# These settings control flood *detection*. When a flood is detected the hub
# drops the offending message and sends the matching msg_user_flood_* warning.
# The action can be customised by loading a flood plugin (see mod_flood in
# plugins.conf), which receives a flood-detected event and may instead let the
# message through, drop it quietly, or disconnect the offender.
#
# The values below are the defaults: counts are measured over a 5 second
# window, so flood_ctl_chat=3 allows 3 chat messages per 5 seconds. Set a
# count to 0 to stop detecting that kind of flood.
# flood_ctl_interval = 5
# flood_ctl_chat = 3
# flood_ctl_connect = 20
# flood_ctl_search = 1
# flood_ctl_update = 2
# flood_ctl_extras = 5

# chat control
# Restricting who may write in main chat is done by the mod_chat_is_privileged
# plugin -- see plugins.conf. The old chat_is_privileged option is obsolete.

# Rich text formatted chat (the RTF0 extension). When enabled the hub advertises
# RTF0, and clients supporting it may mark a message as rich text with the RT1
# flag. Such messages can embed images by URL -- ![description](url) -- which
# supporting clients fetch and display. Set to no to stop advertising RTF0 and
# strip the RT flag from every relayed message, so no images are rendered.
# chat_rich_text = yes

# Timestamp relayed chat messages. When enabled the hub adds a TS flag holding
# the time it relayed the message, in seconds since the Unix epoch, so clients
# that understand the flag show the hub's time rather than their receive time.
# A TS sent by a client is always replaced with the hub's own; chat arriving
# from a linked hub keeps the originating hub's timestamp. Set to no to relay
# messages without a timestamp and strip the TS flag.
# chat_timestamps = yes


# obsolete_clients=1 lets clients using an ADC version older than ADC/1.0 in;
# 0 (the default) refuses them with msg_proto_obsolete_adc0.
# obsolete_clients=0


# The msg_* status strings the hub sends to clients are no longer listed here.
# Every one of them has a sensible built-in default; to change or translate
# them, copy messages.conf and point file_messages (above) at it.
