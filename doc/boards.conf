##
## Example bulletin board configuration for uhub (the BBS0 extension).
##
## Point the hub at this file with the file_bbs_boards option, and enable
## boards with bbs_enable=yes. One board per line:
##
##   board <name> [key=value]...
##
## The board name is protocol text, not a title: 1-64 characters of
## A-Z a-z 0-9 . - _ , case-sensitive. Dots group boards for display by
## convention (dev.adc) and mean nothing else. Clients never use the name as a
## file name, which is just as well, since ".." is a legal one.
##
## Settings:
##
##   title          A human-readable title. Clients that have none display the
##                  board name instead.
##   description    A human-readable description.
##   max_size       The largest post document accepted, in bytes.
##                  Default 262144.
##   replay_days    How far back the hub will replay to a client catching up.
##                  0 (the default) means no age limit -- everything retained.
##
## Permissions. Each takes a credential name (guest, reg, operator, admin, ...)
## naming the *lowest* credential that holds it, or "none" for nobody:
##
##   subscribe      Receive the board's entries.       Default: guest
##   post           Start a new thread.                Default: reg
##   reply          Reply to an existing post.         Default: guest
##   withdraw_own   Withdraw a post of one's own.      Default: reg
##   withdraw_any   Withdraw any post on the board.    Default: operator
##
## A board a session may not subscribe to is not merely read-protected: the hub
## never tells that session the board exists.
##

# An ordinary discussion board on the defaults: everyone reads and replies,
# registered users start threads and can take their own posts back, operators
# moderate. Ninety days of backlog.
board general title="General discussion" description="Anything about this hub" replay_days=90

# An announcements board. Splitting "post" from "reply" is what makes this
# shape possible: operators start the threads, everyone else joins in.
board announcements title="Announcements" description="Operators post, everyone replies" post=operator max_size=65536

# A board for registered users only. Guests are not told it exists.
board members title="Members" subscribe=reg post=reg reply=reg

# A read-only notice board: nobody may post or reply, so the only way anything
# lands on it is an operator withdrawing and replacing what is there.
# board rules title="Hub rules" post=none reply=none withdraw_any=admin
