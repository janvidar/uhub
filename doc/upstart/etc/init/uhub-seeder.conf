# uhub-seeder - seed cache daemon for the uhub ADC hub.
#
# A separate process from uhub: it logs into a hub as a registered bot account
# and serves files that were posted in chat. It needs its own reachable port
# and its own configuration file, /etc/uhub/uhub-seeder.conf; it does not read
# uhub.conf. Do not enable this job until that file has a real hub URL and the
# password of a registered bot account in it.

description "uhub-seeder - seed cache for the uhub ADC hub"

# Start and stop conditions. The hub it logs into does not have to be local,
# so this does not depend on the uhub job.
start on filesystem or runlevel [2345]
stop on runlevel [!2345]

# Allow the service to respawn, but if its happening too often
# (10 times in 5 seconds) there's a problem and we should stop trying.
respawn
respawn limit 10 5

# The program is going to fork, and upstart needs to know this
# so it can track the change in PID.
expect fork

# Set the mode the process should create files in.
umask 022

# uhub-seeder has no -u/-g option of its own -- it never binds a privileged
# port -- so upstart drops privileges for it. The log directory therefore has
# to belong to that user before it starts.
setuid uhub
setgid uhub

# Make sure the log folder exists. Depending on the upstart version this script
# may itself run under the setuid user above, in which case it cannot create a
# directory under /var/log or chown it -- so the package is expected to have
# created /var/log/uhub already, and both commands are best effort here.
pre-start script
    [ -d /var/log/uhub ] || mkdir -p -m0755 /var/log/uhub || true
    chown uhub:uhub /var/log/uhub 2>/dev/null || true
end script

# Command to run it.
exec /usr/bin/uhub-seeder -f -l /var/log/uhub/seeder.log -c /etc/uhub/uhub-seeder.conf
