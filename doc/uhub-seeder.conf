# uhub-seeder.conf - An example configuration file for the seed cache daemon.
# You should normally place this file in /etc/uhub/uhub-seeder.conf
# and customize the settings below.
#
# uhub-seeder is a SEPARATE DAEMON from uhub. It does not read uhub.conf, and
# uhub does not read this file. It logs into a hub as an ordinary ADC client
# and serves the files that were posted in chat, so that they stay available
# after the user who posted them has left.
#
# Two things are required before it will work at all, and neither of them is
# in this file:
#
#   1. A REGISTERED BOT ACCOUNT ON THE HUB.
#      The seeder authenticates with a nick and a password like any other
#      registered user. Credentials come from an auth plugin, not from the
#      ACL file (users.conf), so load one in plugins.conf, for example
#
#        plugin /usr/lib/uhub/mod_auth_sqlite.so "file=/etc/uhub/users.db"
#
#      and register the account with uhub-passwd(1):
#
#        uhub-passwd /etc/uhub/users.db add "[hub]files" "a-long-password" ubot
#
#      Use "ubot", not "bot". The u is for unrestricted, which exempts the
#      account from flood control and from the minimum search length. A busy
#      seeder answers a lot of searches and issues a connect request for every
#      transfer, so a plain bot account will eventually trip flood control and
#      start having its messages dropped -- which looks exactly like the
#      seeder being broken.
#
#   2. ITS OWN REACHABLE PORT.
#      seed_client_port below is a listening port belonging to the seeder, not
#      to the hub, and it must be reachable from the outside: open it in the
#      firewall, and forward it if the machine is behind NAT. A passive seeder
#      cannot serve a passive client -- neither end can accept a connection --
#      and serving passive clients is the entire reason to run one.
#
#      There is deliberately no option for the address to advertise. The
#      seeder is an ordinary client, so the address other users see is the one
#      the hub observed the connection arriving from. A seeder behind NAT is
#      fixed exactly like any other NATed client: list its address in the
#      hub's nat_override setting in uhub.conf.
#
# Check the file without starting the daemon:
#
#   uhub-seeder -C -c /etc/uhub/uhub-seeder.conf
#
# See uhub-seeder(1) and doc/seedcache.txt for the full description.


# -----------------------------------------------------------------------
# Hub connection
# -----------------------------------------------------------------------

# Which hub to log into. REQUIRED, and there is no default.
# Use adcs:// for a TLS hub (what clients normally use), adc:// for plain.
seed_hub_url = "adcs://hub.example.org:1511/"

# The password of the registered bot account. REQUIRED, and there is no
# default. CHANGE THIS -- and keep this file readable only by the user the
# seeder runs as, since the password is in cleartext here.
seed_password = "change-me-to-the-bot-account-password"

# The nick to log in with. It must match the registered account, and it is
# what users see in the user list -- pick something that reads as
# infrastructure rather than as a person. Default is "[seed]cache".
# seed_nick = "[hub]files"

# The description shown in the user list. Default is "seed cache".
# seed_description = "seed cache"


# -----------------------------------------------------------------------
# Client connections
# -----------------------------------------------------------------------

# The port other clients connect to for transfers. This is the seeder's own
# port -- it must NOT be the hub's port, and it must be reachable. Range is
# 1024-65535, default is 1512.
seed_client_port = 1512

# Address to bind the transfer port to. "any" means "::" if IPv6 is supported
# by the host OS, otherwise 0.0.0.0. Default is "any".
# seed_client_bind_addr = any

# TLS on the transfer port. SET THESE. Real DC clients require ADCS for
# transfers, so without a certificate the seeder can offer only plain ADC/1.0
# and passive clients -- the reason the seeder exists -- will refuse it. The
# grant tokens and the file contents would also cross the wire in cleartext.
#
# The certificate may be self-signed and may be the same pair the hub uses: the
# peer is identified by the CID in its CINF, never by its certificate, and no
# client verifies the seeder's either. Both keys must be given together, and a
# certificate that cannot be loaded stops the daemon rather than falling back
# to serving in the clear.
#
# The port serves ADCS and plain ADC at the same time in either case; which one
# a connection is speaking is read from its first bytes.
# seed_tls_certificate = /etc/uhub/seeder.crt
# seed_tls_private_key = /etc/uhub/seeder.key

# Minimum TLS version accepted on the transfer port, and offered when the
# seeder dials out. Valid values are "1.2" and "1.3". Default is "1.2".
# seed_tls_version = "1.2"

# Ciphers for TLS 1.2 and earlier, in the OpenSSL format. Same meaning as the
# hub's tls_ciphersuite, and the same default.
# seed_tls_ciphersuite = "ECDH+AESGCM:DH+AESGCM:ECDH+AES256:DH+AES256:ECDH+AES128:DH+AES:ECDH+3DES:DH+3DES:RSA+AESGCM:RSA+AES:RSA+3DES:!aNULL:!MD5:!DSS"

# Cipher suites for TLS 1.3, which are named in a separate namespace from the
# list above. Same meaning as the hub's tls_ciphersuites.
# seed_tls_ciphersuites = "TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_128_GCM_SHA256"


# -----------------------------------------------------------------------
# Cache
# -----------------------------------------------------------------------

# Where cached files and the cache database live. The directory is created
# with mode 0700 if it does not exist. Default is /var/lib/uhub/seed.
# seed_cache_dir = /var/lib/uhub/seed

# Total size of the cache in MiB. When it is full the oldest entries are
# evicted. Range is 1-1048576, default is 256.
# seed_cache_size = 256

# Largest single file that will be cached, in MiB. Range is 1-1024,
# default is 2.
# seed_max_file_size = 2

# Largest number of files in the cache. Range is 1-1000000, default is 4096.
# seed_max_entries = 4096

# How long an entry is kept, in seconds. 0 means never expire.
# Range is 0-315360000, default is 2592000 (30 days).
# seed_entry_ttl = 2592000

# How many downloads into the cache may run at the same time.
# Range is 1-64, default is 4.
# seed_max_concurrent_ingest = 4

# How many uploads out of the cache may run at the same time.
# Range is 1-1024, default is 16.
# seed_max_concurrent_upload = 16

# Comma separated list of media types that may be cached. The type is decided
# by inspecting the first bytes of the file; the type claimed by the poster
# and the filename extension are both ignored. Default is
# "image/png,image/jpeg,image/gif,image/webp".
#
# Do NOT add image/svg+xml, text/html or text/plain here. SVG carries script,
# and a client that renders chat in a web view would execute it from the
# seeder's own origin. (There is in fact no code path that can detect a file
# as image/svg+xml, so such a file is refused at ingest either way.)
# seed_allowed_types = "image/png,image/jpeg,image/gif,image/webp"


# -----------------------------------------------------------------------
# Who may put things in the cache, and how fast
# -----------------------------------------------------------------------

# The lowest credential class whose chat posts are scanned for content, judged
# by the CT flag the hub publishes for the poster. One of: guest, user,
# operator, super, admin. Default is "user" (registered users and above).
# seed_min_credentials = user

# The quota window in seconds, used by the two settings below.
# Range is 1-86400, default is 300.
# seed_ingest_interval = 300

# How many files one account may push into the cache per window.
# 0 means unlimited. Range is 0-1000, default is 5.
# seed_ingest_per_user = 5

# How many kilobytes one account may push into the cache per window.
# 0 means unlimited. Range is 0-1048576, default is 32768.
# seed_ingest_quota_kb = 32768


# -----------------------------------------------------------------------
# URL mirroring -- OFF by default, and it is an SSRF surface
# -----------------------------------------------------------------------

# When enabled, the seeder fetches plain http:// and https:// URLs that users
# typed into chat. That means an attacker picks the destination and the seeder
# makes the request from inside your network. It is off unless you turn it on
# deliberately. Default is no.
# seed_url_mirror = no

# Ports the seeder is allowed to fetch from, applied to the effective port so
# an implicit 80 or 443 is checked too. Default is "80,443".
# seed_url_allow_ports = "80,443"

# How many HTTP redirects to follow. Every hop is re-checked against the
# address deny list, an https-to-http downgrade is refused, and a redirect to
# the same URL is refused. Range is 0-5, default is 2.
# seed_url_max_redirects = 2

# Time limit for the whole fetch, in seconds. Range is 1-120, default is 30.
# seed_url_timeout = 30

# Verify TLS certificates when fetching https URLs. Default is yes.
# seed_url_verify_tls = yes

# Optional hostname filters. The deny list wins. Both default to empty.
# seed_url_allow_hosts = ""
# seed_url_deny_hosts = ""

# Switches off the checks that stop the seeder from connecting to loopback,
# RFC1918, link-local (169.254.169.254 -- cloud metadata), and the rest of the
# private address space. There is no safe use of this on a machine that can
# reach anything you care about; it exists for closed test setups.
# Default is no. Leave it that way.
# seed_url_allow_private = no


# -----------------------------------------------------------------------
# Optional HTTP endpoint -- OFF by default, and unauthenticated when on
# -----------------------------------------------------------------------

# When enabled, cached files can also be fetched with an ordinary HTTP GET of
# /seed/<tth>. There is no login: the TTH is the only thing between a cached
# file and anyone who can reach the port. Transfers work perfectly well
# without it, so leave it off unless something other than a DC client has to
# fetch files. Default is no.
# seed_http_enable = no

# Port for the HTTP endpoint, when enabled. This is a third port, distinct
# from the hub's and from seed_client_port. Range is 1024-65535,
# default is 1513.
# seed_http_port = 1513
